services:
  dashboard:
    build: .
    image: earlydrop:latest
    container_name: earlydrop-dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped

  deck:
    image: nginx:1.27-alpine
    container_name: earlydrop-deck
    depends_on:
      - dashboard
    # static slides; deck/deck-data.js is written by run_all.py and shipped with the folder
    volumes:
      - ./deck:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped
